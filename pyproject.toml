[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermint"
version = "2.0.0"
description = "Extract, parse, and export academic citations from PDFs, images, and documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akki", email = "placeholder@example.com" }
]

dependencies = [
    "streamlit>=1.36.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",
    "habanero>=1.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# spaCy improves sentence segmentation for the summariser. The summariser
# falls back to a deterministic regex segmenter when it is absent, so the
# application runs correctly without it.
nlp = [
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
papermint = "papermint.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly so the standard is reproducible across ruff releases
# rather than inherited from whichever default set the installed version ships.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # bugbear
    "C4",    # comprehensions
    "UP",    # pyupgrade
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "G",     # logging format
    "LOG",   # logging correctness
    "ISC",   # implicit string concatenation
    "TRY",   # exception handling
    "PTH",   # pathlib over os.path
    "ARG",   # unused arguments
]
ignore = [
    "E501",     # line length is enforced by the formatter
    "TRY003",   # domain errors carry full sentences written for the reader
    "TRY300",   # returning from a try body is clearer here than an else block
    "TRY400",   # logger.error is correct where a traceback adds nothing
    "B008",     # Streamlit widgets are legitimately called in defaults
    "ARG001",   # Streamlit callbacks receive arguments they may not use
    "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "TRY", "PTH"]
# The normaliser's whole purpose is to map ambiguous Unicode punctuation onto
# ASCII, so those characters must appear literally in its translation table.
"papermint/parsers/text_normalizer.py" = ["RUF001"]
"tests/test_normalization.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["papermint"]
