[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermint"
version = "1.0.0"
description = "Extract, parse, and export academic citations from PDFs, images, and documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akki", email = "placeholder@example.com" }
]

dependencies = [
    "streamlit>=1.36.0",
    "spacy>=3.7.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.0",
    "pytextrank>=3.3.0",
    "habanero>=1.2.0",
    "bibtexparser>=2.0.0b1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
